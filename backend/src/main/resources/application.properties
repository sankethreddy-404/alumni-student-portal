# ============================
# Server
# ============================
server.port=8080

# ============================
# Database (MySQL)
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/alumni_portal?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================
# File upload
# ============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ============================
# JWT
# ============================
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProduction123456789
app.jwt.expiration-ms=86400000

# ============================
# Mail (configure with real SMTP credentials to enable email reminders)
# If left as-is, NotificationScheduler will log instead of failing hard.
# ============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false

# ============================
# CORS - allowed frontend origin
# ============================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ============================
# Verification interval (days) - default 180 (~6 months)
# ============================
app.profile.verification-interval-days=180
